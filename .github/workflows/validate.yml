name: ASC Validation

on:
  push:
    branches:
      - main
      - feature/**

  pull_request:
    branches:
      - main

jobs:
  validate:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate ASC Controls
        run: |
          echo "Validating ASC Controls..."
          find controls -name "*.yaml"
