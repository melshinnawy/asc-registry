id: ASC-001

title: Prompt Injection Protection

status: active

created: "2026-10-07"
updated: "2026-10-07"

risk:
  - Prompt Injection
  - Instruction Override

description: >
  AI applications shall implement controls that
  prevent untrusted user inputs from overriding,
  modifying, or bypassing system instructions.

implementation:
  - Separate system prompts from user inputs
  - Validate input content
  - Apply prompt filtering
  - Monitor prompt anomalies

validation:
  - Submit known prompt injection samples
  - Verify system instructions remain intact
  - Confirm restricted functions cannot be triggered

monitoring:
  - Prompt policy violations
  - Failed validation events
  - Injection detection alerts

framework_mappings:
  mitre_atlas:
    - AML.T0051

  owasp_llm:
    - LLM01

  nist_ai_rmf:
    - Govern

references:
  - OWASP Top 10 for LLM Applications
  - MITRE ATLAS

version: "0.1.0"
